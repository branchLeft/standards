# Shared branchLeft Python type-checking policy (SYNC-1). `python_version` is
# deliberately absent — each repo appends its own below, matching its
# pyproject.toml's `requires-python`; PY-3's check verifies they agree.
# Rationale per flag: branchLeft/standards docs/shell-and-python.md.

[mypy]
strict = True
disallow_any_explicit = True

lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@branchleft/prettier-config':
        specifier: workspace:*
        version: link:packages/prettier-config
      '@branchleft/tsconfig':
        specifier: workspace:*
        version: link:packages/tsconfig
      prettier:
        specifier: ^3.6.2
        version: 3.9.6

  packages/prettier-config: {}

  packages/tsconfig: {}

packages:

  prettier@3.9.6:
    resolution: {integrity: sha512-OpN0zzVdiaiAhxpuuj5efpIS4sY9j7bY6uR5mnj5yPzGkdkjNKSJeUThPb60Jw29QuAZgA4o+/iB49kFiaBX6g==}
    engines: {node: '>=14'}
    hasBin: true

snapshots:

  prettier@3.9.6: {}

# Publishes every package in lockstep from one signed tag. See RELEASING.md.
#
# Lockstep is the point: the audit asserts a repo's installed @branchleft/*
# packages are all on one version at or above the floor, which is a one-line
# check rather than a compatibility matrix nobody maintains.
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that attests, so the one job that holds id-token and
    # attestations: write. packages: write moves down from the workflow level
    # with it; nothing else is widened.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the packages that emit
        run: pnpm build

      # A lightweight tag satisfies the release ruleset's `required_signatures`
      # without anyone having signed anything: GitHub validates the signature on
      # the commit a tag points at, not the tag object, so a tag placed on a
      # merge commit that GitHub's own web-flow key signed passes the rule. The
      # only check that tells the two apart is the tag object's own verification
      # status, and a ruleset has no way to express it — so it lives here, ahead
      # of the version assertion, because an unsigned release should fail before
      # anything is built against it.
      #
      # Read from the API rather than the working copy: `git verify-tag` needs
      # the signer's public key in the runner's keyring, which it has no reason
      # to have, and `git cat-file` depends on the checkout having fetched the
      # tag object rather than the commit under it.
      - name: Assert the tag is annotated and signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # gh's own -q expressions, not jq: one fewer thing that has to be
          # present for the release gate to run.
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.type')
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. RELEASING.md requires a signed annotated tag (git tag -s)."
            exit 1
          fi

          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.sha')
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.verification.verified')
          if [ "$verified" != "true" ]; then
            reason=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.verification.reason')
            echo "::error::$TAG's own signature did not verify ($reason)."
            exit 1
          fi

      - name: Assert every package is on the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          fail=0
          for p in packages/*/package.json; do
            got=$(node -p "require('./$p').version")
            if [ "$got" != "$want" ]; then
              echo "::error file=$p::version $got does not match tag $want"
              fail=1
            fi
          done
          # A tag that disagrees with the manifests publishes something nobody
          # asked for, under a version nobody can reproduce from the tree.
          [ "$fail" -eq 0 ]

      # Pack once, attest those exact files, publish those exact files: the
      # bytes signed are the bytes published. The version the attestation's ref
      # is built from is read from the manifest that was packed, not from the
      # ref that triggered the run.
      - name: Pack every package
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          for p in packages/*/; do
            pnpm --dir "$p" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done
          echo "version=$(node -p "require('./packages/tsconfig/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attest @branchleft/tsconfig
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ runner.temp }}/tarballs/branchleft-tsconfig-${{ steps.pack.outputs.version }}.tgz
          repo: branchLeft/standards
          signer-workflow: branchLeft/standards/.github/workflows/publish.yml
          ref: refs/tags/v${{ steps.pack.outputs.version }}

      - name: Attest @branchleft/prettier-config
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ runner.temp }}/tarballs/branchleft-prettier-config-${{ steps.pack.outputs.version }}.tgz
          repo: branchLeft/standards
          signer-workflow: branchLeft/standards/.github/workflows/publish.yml
          ref: refs/tags/v${{ steps.pack.outputs.version }}

      - name: Attest @branchleft/vitest-config
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ runner.temp }}/tarballs/branchleft-vitest-config-${{ steps.pack.outputs.version }}.tgz
          repo: branchLeft/standards
          signer-workflow: branchLeft/standards/.github/workflows/publish.yml
          ref: refs/tags/v${{ steps.pack.outputs.version }}

      - name: Attest @branchleft/eslint-config
        uses: branchLeft/github-workflows/.github/actions/attest-npm-tarball@a2175a416b57f950fed891837f88f2d1a31e00f4 # v1.2.0
        with:
          tarball: ${{ runner.temp }}/tarballs/branchleft-eslint-config-${{ steps.pack.outputs.version }}.tgz
          repo: branchLeft/standards
          signer-workflow: branchLeft/standards/.github/workflows/publish.yml
          ref: refs/tags/v${{ steps.pack.outputs.version }}

      # All four are attested before any is published, so a package that cannot
      # be proven stops the release before the registry sees a lockstep half.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          for name in tsconfig prettier-config vitest-config eslint-config; do
            pnpm publish "$RUNNER_TEMP/tarballs/branchleft-$name-$VERSION.tgz" --no-git-checks --access restricted
          done

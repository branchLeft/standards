# Publishes every package in lockstep from one signed tag. See RELEASING.md.
#
# Lockstep is the point: the audit asserts a repo's installed @branchleft/*
# packages are all on one version at or above the floor, which is a one-line
# check rather than a compatibility matrix nobody maintains.
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the packages that emit
        run: pnpm build

      - name: Assert every package is on the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          fail=0
          for p in packages/*/package.json; do
            got=$(node -p "require('./$p').version")
            if [ "$got" != "$want" ]; then
              echo "::error file=$p::version $got does not match tag $want"
              fail=1
            fi
          done
          # A tag that disagrees with the manifests publishes something nobody
          # asked for, under a version nobody can reproduce from the tree.
          [ "$fail" -eq 0 ]

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -r --filter "./packages/*" publish --no-git-checks --access restricted

# Publishes every package in lockstep from one signed tag. See RELEASING.md.
#
# Lockstep is the point: the audit asserts a repo's installed @branchleft/*
# packages are all on one version at or above the floor, which is a one-line
# check rather than a compatibility matrix nobody maintains.
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the packages that emit
        run: pnpm build

      # A lightweight tag satisfies the release ruleset's `required_signatures`
      # without anyone having signed anything: GitHub validates the signature on
      # the commit a tag points at, not the tag object, so a tag placed on a
      # merge commit that GitHub's own web-flow key signed passes the rule. The
      # only check that tells the two apart is the tag object's own verification
      # status, and a ruleset has no way to express it — so it lives here, ahead
      # of the version assertion, because an unsigned release should fail before
      # anything is built against it.
      #
      # Read from the API rather than the working copy: `git verify-tag` needs
      # the signer's public key in the runner's keyring, which it has no reason
      # to have, and `git cat-file` depends on the checkout having fetched the
      # tag object rather than the commit under it.
      - name: Assert the tag is annotated and signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # gh's own -q expressions, not jq: one fewer thing that has to be
          # present for the release gate to run.
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.type')
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. RELEASING.md requires a signed annotated tag (git tag -s)."
            exit 1
          fi

          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.sha')
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.verification.verified')
          if [ "$verified" != "true" ]; then
            reason=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.verification.reason')
            echo "::error::$TAG's own signature did not verify ($reason)."
            exit 1
          fi

      - name: Assert every package is on the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          fail=0
          for p in packages/*/package.json; do
            got=$(node -p "require('./$p').version")
            if [ "$got" != "$want" ]; then
              echo "::error file=$p::version $got does not match tag $want"
              fail=1
            fi
          done
          # A tag that disagrees with the manifests publishes something nobody
          # asked for, under a version nobody can reproduce from the tree.
          [ "$fail" -eq 0 ]

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -r --filter "./packages/*" publish --no-git-checks --access restricted

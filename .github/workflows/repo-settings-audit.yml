# REPO-6 — the repo-settings audit, run on a schedule and on demand.
#
# Read-only. tools/ruleset-audit.sh only GETs each committed payload's live
# ruleset and exits non-zero on MISSING or DRIFT, so a drifted repo fails this
# run visibly. It never runs tools/ruleset-apply.sh: applying is the platform
# owner's privileged run (docs/repo-settings.md).
#
# Reading another repo's rulesets needs more than the default GITHUB_TOKEN, so
# the audit reads the secret RULESET_AUDIT_TOKEN, by name only. The owner adds
# it; see the PR that introduced this file for its scope.
name: Repo settings audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit live rulesets against the payloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the standards repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default token cannot read rulesets on other repos. Without this
      # check the audit would report every repo as MISSING, which reads as drift
      # rather than as a missing credential.
      - name: Fail visibly when the audit token is absent
        env:
          AUDIT_TOKEN: ${{ secrets.RULESET_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$AUDIT_TOKEN" ]; then
            echo "::error::secret RULESET_AUDIT_TOKEN is not set; the audit cannot read the repos' rulesets"
            exit 1
          fi

      - name: Audit the live rulesets
        env:
          GH_TOKEN: ${{ secrets.RULESET_AUDIT_TOKEN }}
        run: tools/ruleset-audit.sh

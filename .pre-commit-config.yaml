# CI rebuilds and commits the knowledge graph, so every hook here would be
# fixing up a machine-written artefact on someone else's behalf.
exclude: ^graphify-out/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # Stated rather than inherited: the hook's own default has moved before,
      # and this threshold is meant to be the same number in every repo.
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        files: \.sh$

      - id: gate-self-tests
        name: gate self-tests
        entry: ./tools/tests/run.sh
        language: system
        pass_filenames: false
        files: ^(tools|docs)/
